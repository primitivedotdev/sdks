version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      # TypeScript 7 is the native compiler and ships no JavaScript compiler
      # API; the OpenAPI client codegen and declaration bundling still need it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tsx 4.23.15 cannot register its ESM loader on Node 22, which breaks
      # oclif loading the CLI's TypeScript sources in tests.
      - dependency-name: "tsx"
        versions: ["4.23.15"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "uv"
    directory: "/sdk-python"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/sdk-go"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
