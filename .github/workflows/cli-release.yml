name: CLI Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'cli-node/package.json'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Detect version change
        id: version
        run: |
          current_version=$(node -p "require('./cli-node/package.json').version")
          printf 'current=%s\n' "$current_version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || [ -z "${{ github.event.before }}" ]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=

          if git cat-file -e "${{ github.event.before }}:cli-node/package.json" 2>/dev/null; then
            previous_version=$(git show "${{ github.event.before }}:cli-node/package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).version));")
          fi

          if [ "$current_version" = "$previous_version" ]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Detect SDK version change
        id: sdk_version
        run: |
          current_version=$(node -p "require('./sdk-node/package.json').version")
          printf 'current=%s\n' "$current_version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || [ -z "${{ github.event.before }}" ]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=

          if git cat-file -e "${{ github.event.before }}:sdk-node/package.json" 2>/dev/null; then
            previous_version=$(git show "${{ github.event.before }}:sdk-node/package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).version));")
          fi

          if [ "$current_version" = "$previous_version" ]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Check npm publish state
        if: ${{ steps.version.outputs.changed == 'true' }}
        id: npm_state
        env:
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          if npm view "@primitivedotdev/cli@$VERSION" version >/dev/null 2>&1; then
            printf 'published=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'published=false\n' >> "$GITHUB_OUTPUT"

      - name: Wait for matching SDK release
        # When SDK and CLI versions are bumped together, the CLI scaffold may
        # point at the new SDK range. Do not publish that CLI until npm can
        # install the matching SDK version.
        if: ${{ steps.version.outputs.changed == 'true' && steps.npm_state.outputs.published != 'true' && steps.sdk_version.outputs.changed == 'true' }}
        run: scripts/npm-wait-for-version.sh @primitivedotdev/sdk "${{ steps.sdk_version.outputs.current }}" 1200 10

      - name: Install cli dependencies
        # Gated only on the version bump (not the scoped publish state) so the
        # mirror step below can still build and recover even when the scoped
        # package for this version is already on npm.
        if: ${{ steps.version.outputs.changed == 'true' }}
        run: make cli-install

      - name: Publish package to npm
        if: ${{ steps.version.outputs.changed == 'true' && steps.npm_state.outputs.published != 'true' }}
        run: scripts/npm-publish-with-retry.sh --package @primitivedotdev/cli --version "${{ steps.version.outputs.current }}" --directory cli-node

      - name: Publish unscoped mirror package to npm
        # Additive: republishes the identical CLI artifact under the unscoped
        # `primcli` name so `npm i -g primcli` works without the scope. Locked
        # to the same version as @primitivedotdev/cli; the publish helper is a
        # no-op when the mirror version is already on npm.
        #
        # Gated only on the version bump — NOT on the scoped package's publish
        # state — so a run where the scoped publish already happened (e.g. the
        # mirror failed on a prior run before its trusted publisher existed, or
        # a workflow_dispatch re-run) still attempts the mirror and recovers.
        #
        # continue-on-error: the unscoped mirrors are additive. A mirror failure
        # must never fail the job and skip the downstream GitHub release and
        # Homebrew tap steps; the scoped @primitivedotdev/cli publish above is
        # the source of truth. A failed mirror still surfaces as a step warning.
        if: ${{ steps.version.outputs.changed == 'true' }}
        continue-on-error: true
        run: scripts/cli-mirror-publish.sh primcli "${{ steps.version.outputs.current }}"

      - name: Publish unscoped mirror package to npm (primitive)
        # Additive: republishes the identical CLI artifact under the unscoped
        # `primitive` name, the documented primary install (`npm i -g primitive`).
        # Same artifact and version as @primitivedotdev/cli; the publish helper
        # is a no-op when the mirror version is already on npm.
        #
        # Gated only on the version bump — NOT on the scoped package's publish
        # state — so a run where the scoped publish already happened (e.g. the
        # mirror failed on a prior run before its trusted publisher existed, or
        # a workflow_dispatch re-run) still attempts the mirror and recovers.
        #
        # Requires a trusted publisher for the `primitive` package on npm that
        # authorizes this workflow; without it the publish fails like any other
        # unconfigured mirror. continue-on-error keeps that failure from
        # skipping the downstream GitHub release and Homebrew tap steps.
        if: ${{ steps.version.outputs.changed == 'true' }}
        continue-on-error: true
        run: scripts/cli-mirror-publish.sh primitive "${{ steps.version.outputs.current }}"

      - name: Check GitHub release state
        if: ${{ steps.version.outputs.changed == 'true' }}
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cli-node/v${{ steps.version.outputs.current }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'exists=false\n' >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        if: ${{ steps.version.outputs.changed == 'true' && steps.release_state.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cli-node/v${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CLI v$VERSION" \
            --generate-notes

      - name: Configure AWS credentials
        if: ${{ steps.version.outputs.changed == 'true' }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_HOMEBREW_TAP_ROLE_ARN }}
          aws-region: us-west-2

      - name: Fetch CI App credential from Secrets Manager
        id: app-creds
        if: ${{ steps.version.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          JSON=$(aws secretsmanager get-secret-value \
            --secret-id staging/github-ci-app \
            --query SecretString --output text)
          APP_ID=$(printf '%s' "$JSON" | jq -r '.app_id')
          PRIVATE_KEY=$(printf '%s' "$JSON" | jq -r '.private_key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$PRIVATE_KEY"
          echo "app-id=$APP_ID" >> "$GITHUB_OUTPUT"
          {
            echo "private-key<<PEMEOF"
            printf '%s\n' "$PRIVATE_KEY"
            echo "PEMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mint Homebrew tap app token
        id: app-token
        if: ${{ steps.version.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ steps.app-creds.outputs.app-id }}
          private-key: ${{ steps.app-creds.outputs.private-key }}
          owner: primitivedotdev
          repositories: homebrew-tap

      - name: Trigger Homebrew tap update
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail

          node <<'NODE' > dispatch.json
          const payload = {
            event_type: 'cli-release',
            client_payload: {
              version: process.env.VERSION,
              source_repository: process.env.GITHUB_REPOSITORY,
              source_sha: process.env.GITHUB_SHA,
            },
          };

          process.stdout.write(JSON.stringify(payload));
          NODE

          gh api repos/primitivedotdev/homebrew-tap/dispatches \
            --method POST \
            --input dispatch.json
