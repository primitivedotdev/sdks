# Report-only: comments on PRs that touch code cited as evidence by documented
# claims. Never blocks a merge. Requires the DOCFACTS_READ_TOKEN secret.
name: docfacts-impact
on:
  pull_request:
    branches: [main]
permissions:
  pull-requests: write
  contents: read
jobs:
  impact:
    uses: primitivedotdev/docfacts/.github/workflows/impact.yml@ca881c2f19e84c9f977478b6f405b342d3171de4 # pin: docfacts main; bump deliberately
    with:
      repo_key: sdks
      docfacts_ref: ca881c2f19e84c9f977478b6f405b342d3171de4
    secrets:
      docfacts_read_token: ${{ secrets.DOCFACTS_READ_TOKEN }}
