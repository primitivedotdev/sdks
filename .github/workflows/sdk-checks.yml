name: SDK Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed SDKs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.full.outputs.node || steps.filter.outputs.node }}
      cli: ${{ steps.full.outputs.cli || steps.filter.outputs.cli }}
      python: ${{ steps.full.outputs.python || steps.filter.outputs.python }}
      go: ${{ steps.full.outputs.go || steps.filter.outputs.go }}
      shared: ${{ steps.full.outputs.shared || steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: full
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
        run: |
          printf 'node=true\n' >> "$GITHUB_OUTPUT"
          printf 'cli=true\n' >> "$GITHUB_OUTPUT"
          printf 'python=true\n' >> "$GITHUB_OUTPUT"
          printf 'go=true\n' >> "$GITHUB_OUTPUT"
          printf 'shared=true\n' >> "$GITHUB_OUTPUT"

      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            node:
              - 'sdk-node/**'
              - 'packages/api-core/**'
              - 'openapi/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            cli:
              - 'cli-node/**'
              - 'packages/api-core/**'
              - 'openapi/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            python:
              - 'sdk-python/**'
              - 'openapi/**'
            go:
              - 'sdk-go/**'
              - 'openapi/**'
            shared:
              - '.github/workflows/**'
              - 'Makefile'
              - 'json-schema/**'
              - 'openapi/**'
              - 'test-fixtures/**'
              - 'scripts/smoke-signal-retry.py'
              - 'scripts/signal-retry/**'
              - 'scripts/parser-differential/**'
              - 'sdk-node/src/interactions/**'
              - 'sdk-python/src/primitive/interactions.py'
              - 'sdk-python/src/primitive/signals.py'
              - 'sdk-python/src/primitive/signal_content.py'
              - 'sdk-go/interactions.go'
              - 'sdk-go/signals.go'
              - 'sdk-go/signal_content.go'

  node:
    name: Node (${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make node-install

      - name: Run node checks
        run: make node-check

      # node-smoke builds the SDK, checks tarball isolation, then tests an
      # installed package. Keep these together so declarations build once.
      - name: Build, check isolation, and smoke test packed node package
        run: make node-smoke

      - name: Collect node coverage
        run: make node-coverage

  cli:
    name: CLI (${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make cli-install

      - name: Run cli checks
        run: make cli-check

      - name: Build cli package
        run: make cli-build

      - name: Assert CLI tarball does not leak api-core or sdk into dependencies
        run: make cli-tarball-isolation

      - name: Smoke test packed cli package
        run: make cli-smoke

      - name: Collect cli coverage
        run: make cli-coverage

  python:
    name: Python (${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: make python-sync

      - name: Run python checks
        run: make python-check

      - name: Build python package
        run: make python-build

      - name: Smoke test built python wheel
        run: make python-smoke

      - name: Collect python coverage
        run: make python-coverage

  go:
    name: Go (${{ matrix.go-version }})
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk-go/go.sum

      - name: Run go checks
        run: make go-check

      - name: Build go package
        run: make go-build

      - name: Collect go coverage
        run: make go-coverage

  shared:
    name: Shared
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.14"
          save-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26"
          cache-dependency-path: sdk-go/go.sum

      - name: Install node dependencies
        run: make node-install

      - name: Sync python dependencies
        run: make python-sync

      - name: Run shared fixture checks
        run: make shared-check

      - name: Check packaged signal crash and retry
        run: make signal-retry-smoke

      - name: Compare interaction parsers and calibrate fault detection
        run: |
          python3 scripts/parser-differential/run.py --cases 1000 --seed 1000 --output "${RUNNER_TEMP}/parser-differential"
          python3 scripts/parser-differential/selftest.py

  ci:
    name: CI
    needs: [changes, node, cli, python, go, shared]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.changes.result }}" "${{ needs.node.result }}" "${{ needs.cli.result }}" "${{ needs.python.result }}" "${{ needs.go.result }}" "${{ needs.shared.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Job failed with result: $r"
              exit 1
            fi
          done
