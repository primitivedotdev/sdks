[package]
name = "primitive-rust"
version = "0.1.0"
edition = "2021"
default-run = "primitive-rust"
description = "Rust port of the Primitive CLI for local parity and release-readiness validation."
license = "MIT"
repository = "https://github.com/primitivedotdev/sdks"
homepage = "https://primitive.dev"
readme = "README.md"
keywords = ["primitive", "cli", "email", "agents"]
publish = false
exclude = ["dist/**"]

[[bin]]
name = "primitive-rust"
path = "src/main.rs"

[[bin]]
name = "primitive"
path = "src/bin/primitive.rs"

[[bin]]
name = "prim"
path = "src/bin/prim.rs"

[dependencies]
anyhow = "1.0.98"
aes-gcm = "0.10.3"
base64 = "0.22.1"
dirs = "5.0.1"
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
hkdf = "0.12.4"
k256 = { version = "0.13.4", features = ["ecdsa"] }
libc = "0.2.186"
rand = "0.8.5"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha2 = "0.10.9"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
urlencoding = "2.1.3"
